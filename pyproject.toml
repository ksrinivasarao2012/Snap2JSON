[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snap2json"
version = "0.1.0"
description = "Receipt extraction: OCR+LLM vs VLM"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pandas",
    "datasets",
    "python-dotenv",
    "Pillow",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest"]
ocr = ["paddleocr", "paddlepaddle", "pytesseract"]
models = ["torch", "transformers", "google-genai"]
app = ["fastapi", "uvicorn", "streamlit", "python-multipart"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
